version: '3.8'

services:
  api:
    build: 
      context: ../
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=cache
      - OTLP_ENDPOINT=http://jaeger:4317
      - MODEL_ENV=production
    depends_on:
      - cache
      - jaeger
    networks:
      - ai-network

  worker:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
    command: ["celery", "-A", "code_examples.celery_worker.celery_app", "worker", "--loglevel=info"]
    environment:
      - REDIS_URL=redis://cache:6379/0
    depends_on:
      - cache
    networks:
      - ai-network

  cache:
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    networks:
      - ai-network
    deploy:
      resources:
        limits:
          memory: 2G

  # New Distributed Tracing UI
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # Jaeger Web UI
      - "4317:4317"   # OTLP gRPC endpoint
    networks:
      - ai-network

networks:
  ai-network:
    driver: bridge