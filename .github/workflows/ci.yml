name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff mypy pre-commit types-redis

    - name: Lint and Type Check
      run: |
        ruff check .
        ruff format --check .
        mypy code_examples/ --ignore-missing-imports

    - name: Run Pytest
      run: |
        export PYTHONPATH=$PWD
        pytest tests/